<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>juliaJ</title>
    
    <!-- Importação de Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <!-- Estilização CSS Incorporada para Personalização Completa -->
    <style>
        :root {
            --primary-color: #E50914; /* Vermelho Netflix */
            --bg-color: #111116;      /* Fundo quase preto */
            --bg-card: #181820;       /* Fundo dos cartões */
            --text-color: #FFFFFF;    /* Texto principal */
            --text-secondary: #AAAAAA;/* Texto secundário */
            --glow-color: rgba(229, 9, 20, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Chakra Petch", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* Cabeçalho */
        header {
            background-color: rgba(17, 17, 22, 0.95);
            color: var(--primary-color);
            padding: 20px 4%;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-shadow: 0 0 10px var(--glow-color);
        }

        /* Seção Principal (Chamada) */
        .chamada {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 60px 4%;
            background: linear-gradient(180deg, rgba(229, 9, 20, 0.1) 0%, rgba(17, 17, 22, 1) 100%);
            border-bottom: 1px solid #222;
        }

        @media (min-width: 900px) {
            .chamada {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
                padding: 80px 6%;
            }
        }

        .chamada-texto {
            flex: 1;
            max-width: 500px;
            text-align: center;
        }

        @media (min-width: 900px) {
            .chamada-texto {
                text-align: left;
            }
        }

        .chamada-texto h1 {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #FFFFFF, var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chamada-texto p {
            font-size: 1.2rem;
            color: var(--primary-color);
            background-color: rgba(229, 9, 20, 0.15);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 500;
            border: 1px solid rgba(229, 9, 20, 0.3);
        }

        /* Container do Vídeo do YouTube */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px var(--glow-color);
            aspect-ratio: 16 / 9;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Seção de Categorias e Vídeos */
        .categoria {
            padding: 40px 4%;
        }

        .categoria h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 600;
            position: relative;
            display: inline-block;
            padding-bottom: 8px;
        }

        .categoria h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60%;
            height: 3px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        /* Carrossel / Grade de Vídeos */
        .categoria-videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding: 10px 0;
        }

        /* Ajustes de responsividade para telas menores */
        @media (max-width: 600px) {
            .categoria-videos {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        /* Item de Vídeo (Cards) */
        .categoria-videos a {
            display: block;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
            position: relative;
            background-color: var(--bg-card);
            border: 1px solid #222;
        }

        .categoria-videos a:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 12px 25px rgba(229, 9, 20, 0.3);
            border-color: var(--primary-color);
        }

        .categoria-videos img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            aspect-ratio: 16 / 9;
            transition: filter 0.3s ease;
        }

        .categoria-videos a:hover img {
            filter: brightness(1.1);
        }

        /* Efeito de Play ao passar o mouse */
        .categoria-videos a::before {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 2rem;
            color: white;
            background: rgba(229, 9, 20, 0.8);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            opacity: 0;
            z-index: 2;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .categoria-videos a:hover::before {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>

<body>
    <!-- Cabeçalho Principal -->
    <header>juhFLIX</header>

    <!-- Seção de Chamada com Destaque -->
    <section class="chamada">
        <div class="chamada-texto">
            <h1>Através do Aranhaverso</h1>
            <p>#homem-aranha</p>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/gt_fAE1Eg2Q?si=EEv-tsY_b1B2OwKE"
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>

    <!-- Galeria de Filmes e Séries -->
    <section class="categoria">
        <h2>Filmes e séries</h2>
        <div class="categoria-videos">
            <a href="https://www.youtube.com/watch?v=cs15QqG6Gjc" target="_blank" rel="noopener">
                <img src="https://img.youtube.com/vi/cs15QqG6Gjc/maxresdefault.jpg" alt="Video 1" onerror="this.src='https://via.placeholder.com/320x180/181820/ffffff?text=Video+Indisponível'"/>
            </a>
            <a href="https://www.youtube.com/watch?v=nCmIwcycUJ8" target="_blank" rel="noopener">
                <img src="https://img.youtube.com/vi/nCmIwcycUJ8/maxresdefault.jpg" alt="Video 2" onerror="this.src='https://via.placeholder.com/320x180/181820/ffffff?text=Video+Indisponível'"/>
            </a>
            <a href="https://www.youtube.com/watch?v=FvRmEapoHRc" target="_blank" rel="noopener">
                <img src="https://img.youtube.com/vi/FvRmEapoHRc/maxresdefault.jpg" alt="Video 3" onerror="this.src='https://via.placeholder.com/320x180/181820/ffffff?text=Video+Indisponível'"/>
            </a>
            <a href="https://www.youtube.com/watch?v=Ipkw_hWW-Hw" target="_blank" rel="noopener">
                <img src="https://img.youtube.com/vi/Ipkw_hWW-Hw/maxresdefault.jpg" alt="Video 4" onerror="this.src='https://via.placeholder.com/320x180/181820/ffffff?text=Video+Indisponível'"/>
            </a>
            <a href="https://www.youtube.com/watch?v=d4DzMNGoyis" target="_blank" rel="noopener">
                <img src="https://img.youtube.com/vi/d4DzMNGoyis/maxresdefault.jpg" alt="Video 5" onerror="this.src='https://via.placeholder.com/320x180/181820/ffffff?text=Video+Indisponível'"/>
            </a>
        </div>
    </section>

</body>

</html>
